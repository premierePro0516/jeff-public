# ※※※※※※※※※※※※※※※ 规则匹配 ※※※※※※※※※※※※※※※
rules:
  # 内网直连
  - RULE-SET,private_domain,直接连接                      # Private
  - RULE-SET,private_ip,直接连接,no-resolve               # Private
  - SRC-IP-CIDR,192.168.2.3/32,直接连接,no-resolve        # My NAS

  # 拦截屏蔽
  - RULE-SET,Tracking,REJECT
  - RULE-SET,Advertising,REJECT
  - AND,((DST-PORT,443),(NETWORK,UDP)),REJECT            # 阻止海外 QUIC
  - RULE-SET,Hijacking,REJECT-DROP
  - RULE-SET,BanAD,REJECT-DROP
  - RULE-SET,BanProgramAD,REJECT-DROP
  - RULE-SET,adobe_domain,REJECT-DROP

